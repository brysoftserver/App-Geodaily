<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>GEODAILY — QR Expo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0D3B0F 0%, #1B5E20 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }
    h1 {
      color: #1B5E20;
      font-size: 24px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    #qrcode {
      display: inline-block;
      padding: 16px;
      background: white;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      margin-bottom: 20px;
    }
    #qrcode img {
      width: 250px;
      height: 250px;
      image-rendering: pixelated;
    }
    .url {
      background: #f5f5f5;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #333;
      word-break: break-all;
      margin-bottom: 16px;
    }
    .instructions {
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }
    .instructions strong {
      color: #1B5E20;
    }
    .port-badge {
      display: inline-block;
      background: #1B5E20;
      color: white;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .refresh-btn {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #1B5E20;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .refresh-btn:hover {
      background: #c8e6c9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌱</div>
    <h1>GEODAILY</h1>
    <p class="subtitle">App Móvil — Escanea con Expo Go</p>
    <div class="port-badge">🚀 Puerto 8082</div>
    <div id="qrcode">
      <img src="qr_expo.png" alt="QR Expo Go" width="250" height="250" style="image-rendering:pixelated;border-radius:8px;"/>
    </div>
    <div class="url" id="expourl">exp://192.168.80.20:8082</div>
    <p class="instructions">
      1. Instala <strong>Expo Go</strong> en tu celular<br/>
      2. Escanea el código QR con la app<br/>
      3. Espera a que cargue la aplicación
    </p>
    <button class="refresh-btn" onclick="location.reload()">⟳ Actualizar QR</button>
  </div>

</body>
</html>
